name: .NET CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: hello-dotnet-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: hello-dotnet-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish src/HelloDotnet.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:Version=${{ github.ref_name }} -o publish

      - name: Find and rename
        shell: bash
        run: |
          echo "=== Содержимое publish/ ==="
          ls -la publish/

          if [ "${{ runner.os }}" = "Windows" ]; then
            SRC=$(find publish -maxdepth 1 -name "*.exe" -type f | head -n1)
          else
            SRC=$(find publish -maxdepth 1 -type f -executable ! -name "*.dll" ! -name "*.json" ! -name "*.pdb" | head -n1)
          fi

          echo "Найден исходный файл: $SRC"

          if [ -z "$SRC" ]; then
            echo "❌ Не нашли бинарник в publish/"
            exit 1
          fi

          mv "$SRC" "publish/${{ matrix.artifact }}"
          echo "✅ Переименован в publish/${{ matrix.artifact }}"
          ls -la publish/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/${{ matrix.artifact }}
          generate_release_notes: true
