name: .NET CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: hello-dotnet-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: hello-dotnet-linux-arm64
          - os: macos-14
            rid: osx-x64
            artifact: hello-dotnet-macos-x64
          - os: macos-14
            rid: osx-arm64
            artifact: hello-dotnet-macos-arm64
          - os: windows-latest
            rid: win-x64
            artifact: hello-dotnet-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/HelloDotnet.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ github.ref_name }}
          -o publish

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv publish/hello-dotnet publish/${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv publish/hello-dotnet.exe publish/${{ matrix.artifact }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/${{ matrix.artifact }}
          generate_release_notes: true
